<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Controle Financeiro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#0f172a;--mu:#64748b;--pr:#4f46e5;--pr2:#7c3aed;--bd:#e5e7ef;--rd:#e11d48;--ok:#059669;--on:#fff;--sh:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f1a;--card:#131a2b;--tx:#e8ecf6;--mu:#8a94ad;--pr:#818cf8;--pr2:#a78bfa;--bd:#22304a;--rd:#fb7185;--ok:#34d399;--on:#0b0f1a;--sh:0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0f1a;--card:#131a2b;--tx:#e8ecf6;--mu:#8a94ad;--pr:#818cf8;--pr2:#a78bfa;--bd:#22304a;--rd:#fb7185;--ok:#34d399;--on:#0b0f1a;--sh:0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--tx);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 420px at 8% -8%,color-mix(in srgb,var(--pr) 16%,transparent),transparent),var(--bg);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.w{max-width:920px;margin:0 auto;padding:28px 18px 48px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 0;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em}
.brand i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--pr),var(--pr2))}
.tt{width:42px;height:42px;padding:0;margin:0;display:grid;place-items:center;border-radius:12px;background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:var(--sh)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:var(--sh)}
h1,h2,h3{margin:0 0 10px}h1{font-size:1.75rem;letter-spacing:-.03em;margin:8px 0 2px}h2{font-size:1.1rem;letter-spacing:-.01em}h3{font-size:.8rem;font-weight:500;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
input,select,button{font:inherit;padding:11px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%;transition:.15s}
input:focus,select:focus{outline:2px solid var(--pr);outline-offset:1px}
label{display:block;font-size:.8rem;font-weight:500;color:var(--mu);margin:12px 0 5px}
button{background:linear-gradient(135deg,var(--pr),var(--pr2));color:var(--on);border:0;font-weight:600;cursor:pointer;margin-top:14px}
button:hover{filter:brightness(1.08)}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.x{background:transparent;color:var(--rd);width:auto;margin:0;padding:4px 8px}
nav{display:flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow-x:auto;margin:14px 0 18px}
nav button{flex:1;background:transparent;color:var(--mu);margin:0;width:auto;padding:9px 14px;white-space:nowrap}
nav button.on{background:linear-gradient(135deg,var(--pr),var(--pr2));color:var(--on)}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:6px}.g3 .card{margin:0}
.hero{background:linear-gradient(135deg,var(--pr),var(--pr2));color:var(--on);border:0}.hero h3{color:inherit;opacity:.8}
.k{font-size:1.5rem;font-weight:700;letter-spacing:-.02em}.pos{color:var(--ok)}.neg{color:var(--rd)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.mu{color:var(--mu);font-size:.85rem}
.mn{display:flex;align-items:center;gap:8px;margin-bottom:14px}.mn button{width:44px;margin:0}.mn b{flex:1;text-align:center;text-transform:capitalize;font-size:1.05rem}
.err{color:var(--rd);font-size:.9rem;margin-top:8px}
.cv{position:relative;height:270px}
.au{max-width:420px;margin:5vh auto}
.chk{display:flex;gap:10px;align-items:center;margin-top:14px}.chk input{width:auto}
.land{display:grid;grid-template-columns:1.15fr 1fr;gap:40px;align-items:center;min-height:80vh}
@media(max-width:820px){.land{grid-template-columns:1fr;gap:24px;min-height:0}}
.pill{display:inline-block;padding:6px 12px;border-radius:99px;font-size:.8rem;font-weight:600;color:var(--pr);background:color-mix(in srgb,var(--pr) 12%,transparent)}
.big{font-size:clamp(2rem,5vw,3.1rem);line-height:1.08;letter-spacing:-.04em;margin:16px 0 14px}
.lead{color:var(--mu);font-size:1.05rem;max-width:520px;margin:0}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
@media(max-width:520px){.feat{grid-template-columns:1fr}}
.fc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:var(--sh)}.fc b{display:block;margin-bottom:4px}.fc span{color:var(--mu);font-size:.88rem}
.au{margin:0;max-width:none}
.ft{text-align:center;margin-top:28px;font-size:.85rem}.ft a,.ckb a{color:var(--pr)}
.ckb{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;box-shadow:var(--sh);z-index:20;display:flex;gap:12px;align-items:center}
.ckb p{margin:0;font-size:.85rem;color:var(--mu)}.ckb button{width:auto;margin:0;white-space:nowrap}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:grid;place-items:center;padding:16px}.mod .card{max-width:560px;max-height:85vh;overflow:auto;margin:0}
.mod p,.mod li{font-size:.9rem;color:var(--mu)}
.pw{position:relative}.pw input{padding-right:48px}
.pw .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;margin:0;padding:0;background:transparent;color:var(--mu);display:grid;place-items:center;border-radius:10px}
.pw .eye:hover{color:var(--tx);filter:none}
</style></head><body><div class="w" id="app"></div>
<script>
// 1) Cole aqui os dados do seu projeto Supabase (Project Settings > API). A chave anon e publica; a seguranca vem das regras RLS do schema.sql
const SUPABASE_URL='https://agqyrcohldtehqpdgrtw.supabase.co',SUPABASE_KEY='sb_publishable_1xdWbAbX6PMG5wVDeiyDmQ_iJUl-Gmv';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const mem={};
const st={get(k){if(k in mem)return mem[k];try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){delete mem[k];try{localStorage.removeItem(k)}catch(e){}}};
const TYPES={entrada:'Entradas de dinheiro',fixo:'Gastos fixos',variavel:'Gastos variáveis',parcela:'Parcelas',fin:'Financiamentos'};
const FIN=['Imobiliário','Veículo','Estudantil (FIES)','Consignado','Pessoal','Empresarial / Capital de giro','Outro'];
let me=null,U={},D=null,mode='login',tab='resumo',month=new Date().toISOString().slice(0,7),err='',charts=[];
const idx=m=>{const[y,o]=m.split('-');return +y*12+ +o-1};
const addM=(m,n)=>{const i=idx(m)+n;return Math.floor(i/12)+'-'+String(i%12+1).padStart(2,'0')};
const lbl=m=>{const[y,o]=m.split('-');return new Date(+y,+o-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})};
let info='',uid=null,rec=false,showCk=false;
const sbc=window.supabase&&SUPABASE_URL.startsWith('https://')?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
async function setSess(ses){
  if(!ses){me=null;D=null;uid=null;return}
  uid=ses.user.id;me=ses.user.email;U={};U[me]={name:(ses.user.user_metadata&&ses.user.user_metadata.name)||me};
  const[a,b]=await Promise.all([sbc.from('settings').select('*').maybeSingle(),sbc.from('entries').select('*').order('id')]);
  const x=a.data||{};
  D={s1:+x.s1||0,n1:x.n1||'',s2:+x.s2||0,n2:x.n2||'',on:!!x.joint,e:(b.data||[]).map(r=>({...r,v:+r.v}))};
}
async function auth(){
  const email=$('#em').value.trim().toLowerCase(),p=$('#pw').value;err='';info='';
  if(!/^\S+@\S+\.\S+$/.test(email))err='E-mail inválido.';
  else if(p.length<6)err='A senha precisa ter pelo menos 6 caracteres.';
  else if(mode==='signup'){
    const name=$('#nm').value.trim();
    if(!name)err='Informe seu nome.';
    else if(p!==$('#pw2').value)err='As senhas não conferem.';
    else{const{data,error}=await sbc.auth.signUp({email,password:p,options:{data:{name},emailRedirectTo:location.origin+location.pathname}});
      if(error)err=error.message;
      else if(data.session){await setSess(data.session);tab='resumo'}
      else{info='Conta criada! Confirme seu e-mail e depois entre.';mode='login'}}
  }else{
    const{data,error}=await sbc.auth.signInWithPassword({email,password:p});
    if(error)err='E-mail ou senha incorretos.';else{await setSess(data.session);tab='resumo'}
  }
  draw();
}
const logout=async()=>{await sbc.auth.signOut();me=null;D=null;mode='login';draw()};
function items(m){return D.e.flatMap(e=>{const d=idx(m)-idx(e.m);
  if(e.t==='fixo')return d>=0?[{...e}]:[];
  if(e.t==='parcela'||e.t==='fin'){const n=+e.n||1;return d>=0&&d<n?[{...e,tag:(d+1)+'/'+n}]:[]}
  return d===0?[{...e}]:[]})}
const sal=()=>(+D.s1||0)+(D.on?+D.s2||0:0);
function tot(m){const it=items(m),s=t=>it.filter(i=>i.t===t).reduce((a,i)=>a+ +i.v,0);
  const o={fixo:s('fixo'),variavel:s('variavel'),parcela:s('parcela'),fin:s('fin')};
  o.in=sal()+s('entrada');o.out=o.fixo+o.variavel+o.parcela+o.fin;o.bal=o.in-o.out;return o}
function nav(){return `<h1>Olá, ${esc(U[me].name.split(' ')[0])}</h1><p class="mu">Seu painel financeiro</p><nav>${[['resumo','Resumo'],['mes','Mês a mês'],['cfg','Configurações']].map(([k,n])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';draw()">${n}</button>`).join('')}</nav>`}
const mn=()=>`<div class="mn"><button class="g" onclick="month=addM(month,-1);draw()">‹</button><b>${lbl(month)}</b><button class="g" onclick="month=addM(month,1);draw()">›</button></div>`;
function draw(){
  charts.forEach(c=>c.destroy());charts=[];const a=$('#app');
  if(rec||!me){a.innerHTML=land();return}
  let h=nav();
  if(tab==='resumo'){const t=tot(month);
    h+=mn()+`<div class="g3"><div class="card"><h3>Renda</h3><div class="k pos">${R(t.in)}</div></div><div class="card"><h3>Gastos</h3><div class="k neg">${R(t.out)}</div></div><div class="card hero"><h3>Saldo</h3><div class="k">${R(t.bal)}</div></div></div>
    ${D.on&&D.s2?`<p class="mu">Renda conjunta: ${esc(D.n1||'Pessoa 1')} ${R(D.s1)} + ${esc(D.n2||'Pessoa 2')} ${R(D.s2)}</p>`:''}
    <p class="mu">${t.in?Math.round(t.out/t.in*100)+'% da renda comprometida neste mês.':'Cadastre sua renda em Configuração.'}</p>
    <div class="card"><h2>Para onde vai o dinheiro</h2><div class="cv"><canvas id="c1"></canvas></div></div>
    <div class="card"><h2>Últimos 6 meses</h2><div class="cv"><canvas id="c2"></canvas></div></div>`;
  }else if(tab==='mes'){
    h+=mn()+`<div class="card"><h2>Adicionar lançamento</h2>
    <label>Tipo</label><select id="t" onchange="tg()">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
    <div id="ft" style="display:none"><label>Tipo de financiamento</label><select id="ftp">${FIN.map(f=>`<option>${f}</option>`).join('')}</select></div>
    <label>Descrição</label><input id="d"><label id="vl">Valor (R$)</label><input id="v" type="number" step="0.01" min="0" inputmode="decimal">
    <div id="fn" style="display:none"><label>Quantidade de parcelas</label><input id="n" type="number" min="1" value="12"></div>
    <div class="err">${err}</div><button onclick="add()">Adicionar em ${lbl(month)}</button></div>`;
    const it=items(month);
    h+=Object.entries(TYPES).map(([k,v])=>{const l=it.filter(i=>i.t===k);return `<div class="card"><h2>${v} <span class="mu">${R(l.reduce((a,i)=>a+ +i.v,0))}</span></h2>${l.map(i=>`<div class="row"><div>${esc(i.d)} ${i.tag?`<span class="mu">(${i.tag})</span>`:''}<div class="mu">${i.f?esc(i.f):''}${k==='fixo'?'todo mês':''}</div></div><div>${R(i.v)} <button class="x" onclick="del(${i.id})">✕</button></div></div>`).join('')||'<div class="mu">Nada lançado.</div>'}</div>`}).join('');
    if(sal())h+=`<p class="mu">Salário(s) de ${R(sal())} já entram automaticamente na renda.</p>`;
  }else{
    h+=`<div class="card"><h2>Perfil</h2><label>Nome</label><input id="un" value="${esc(U[me].name)}"><label>E-mail</label><input value="${esc(me)}" disabled><button onclick="saveName()">Salvar nome</button></div>
    <div class="card"><h2>Salário fixo</h2><label>Seu nome</label><input id="n1" value="${esc(D.n1||'')}"><label>Salário mensal (R$)</label><input id="s1" type="number" step="0.01" value="${D.s1||''}">
    <div class="chk"><input type="checkbox" id="on" ${D.on?'checked':''} onchange="D.on=this.checked;sv(false);draw()"><label style="margin:0">Somar o salário de outra pessoa</label></div>
    ${D.on?`<label>Nome da outra pessoa</label><input id="n2" value="${esc(D.n2||'')}"><label>Salário dela (R$)</label><input id="s2" type="number" step="0.01" value="${D.s2||''}">`:''}
    <p class="k pos">Renda total: ${R(sal())}</p><button onclick="sv(true)">Salvar salários</button></div>
    <div class="card"><h2>Aparência</h2><div class="g3"><button class="${cur()==='light'?'':'g'}" onclick="theme('light')">Modo claro</button><button class="${cur()==='dark'?'':'g'}" onclick="theme('dark')">Modo escuro</button></div></div>
    <div class="card"><h2>Conta</h2><button class="g" onclick="logout()">Sair</button><button class="g" onclick="clearAll()">Apagar meus lançamentos</button><button class="g" onclick="cookies(1)">Política de cookies</button></div>`;}
  a.innerHTML=h+foot();if(tab==='mes')tg();if(tab==='resumo')ch();
}
function tg(){const t=$('#t').value,p=t==='parcela'||t==='fin';$('#ft').style.display=t==='fin'?'block':'none';$('#fn').style.display=p?'block':'none';$('#vl').textContent=p?'Valor da parcela (R$)':'Valor (R$)'}
async function add(){const t=$('#t').value,d=$('#d').value.trim(),v=parseFloat($('#v').value);
  if(!d||!(v>0)){err='Preencha descrição e um valor maior que zero.';draw();return}
  const{data,error}=await sbc.from('entries').insert({t,d,v,m:month,n:+($('#n').value)||1,f:t==='fin'?$('#ftp').value:''}).select().single();
  if(error)err='Erro ao salvar: '+error.message;else{err='';D.e.push({...data,v:+data.v})}draw()}
async function del(id){const{error}=await sbc.from('entries').delete().eq('id',id);if(!error)D.e=D.e.filter(e=>e.id!==id);draw()}
async function sv(r){if($('#s1')){D.n1=$('#n1').value;D.s1=+$('#s1').value||0;if($('#s2')){D.n2=$('#n2').value;D.s2=+$('#s2').value||0}}
  await sbc.from('settings').upsert({user_id:uid,n1:D.n1,s1:D.s1,n2:D.n2,s2:D.s2,joint:D.on});if(r)draw()}
async function saveName(){const n=$('#un').value.trim();if(n){await sbc.auth.updateUser({data:{name:n}});U[me].name=n}draw()}
async function clearAll(){if(confirm('Apagar todos os seus lançamentos?')){await sbc.from('entries').delete().eq('user_id',uid);D.e=[];draw()}}
async function init(){
  if(!sbc){$('#app').innerHTML='<div class="card"><h2>Configure o Supabase</h2><p class="mu">Preencha SUPABASE_URL e SUPABASE_KEY no topo do script.</p></div>';return}
  sbc.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){rec=true;mode='reset';draw()}else if(ev==='SIGNED_OUT'&&me){me=null;D=null;draw()}});
  if(/type=recovery/.test(location.hash)){rec=true;mode='reset'}
  const{data}=await sbc.auth.getSession();await setSess(data.session);draw();
}
const go=m=>{mode=m;err='';info='';draw()};
async function forgot(){const email=$('#em').value.trim().toLowerCase();err='';info='';
  if(!/^\S+@\S+\.\S+$/.test(email))err='Informe um e-mail válido.';
  else{const{error}=await sbc.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
    if(error)err=error.message;else info='Se este e-mail estiver cadastrado, você receberá um link para criar uma nova senha.'}
  draw()}
async function resetPw(){const p=$('#np').value;err='';
  if(p.length<6)err='A senha precisa ter pelo menos 6 caracteres.';
  else if(p!==$('#np2').value)err='As senhas não conferem.';
  else{const{error}=await sbc.auth.updateUser({password:p});
    if(error)err=error.message;else{rec=false;mode='login';info='';history.replaceState(null,'',location.pathname);const{data}=await sbc.auth.getSession();await setSess(data.session);tab='resumo'}}
  draw()}
const cookies=v=>{showCk=!!v;draw()},okCk=()=>{st.set('fin_ck',1);draw()};
const FT=[['Resumo visual','Gráficos de pizza e de barras mostram renda, gastos e saldo.'],['Mês a mês','Entradas, gastos fixos e variáveis organizados em um só lugar.'],['Parcelas e financiamentos','Imobiliário, veículo, FIES e outros, com controle das parcelas.'],['Renda conjunta','Some dois salários e deixe os cálculos por conta do app.']];
const EYE='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',EYEOFF='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.4 10.4 0 0 1 12 19c-6.4 0-10-7-10-7a18 18 0 0 1 5-5.9M9.9 5.2A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a18 18 0 0 1-2.2 3.2M1 1l22 22M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
const tpw=(id,b)=>{const i=$('#'+id),h=i.type==='password';i.type=h?'text':'password';b.innerHTML=h?EYEOFF:EYE;b.setAttribute('aria-label',h?'Ocultar senha':'Mostrar senha')};
const inp=(id,l,ty,ac)=>ty==='password'?`<label>${l}</label><div class="pw"><input id="${id}" type="password" autocomplete="${ac}"><button type="button" class="eye" onclick="tpw('${id}',this)" aria-label="Mostrar senha">${EYE}</button></div>`:`<label>${l}</label><input id="${id}" type="${ty}" autocomplete="${ac}">`;
function form(){const m=mode,F={login:['Entrar na conta','Entrar','auth()'],signup:['Criar conta gratuita','Cadastrar','auth()'],forgot:['Recuperar conta','Enviar link de recuperação','forgot()'],reset:['Criar nova senha','Salvar nova senha','resetPw()']}[m]||['','',''];

function ch(){if(!window.Chart)return;const cs=getComputedStyle(document.documentElement),tx=cs.getPropertyValue('--tx'),bd=cs.getPropertyValue('--bd'),t=tot(month);
  const pal=['#6366f1','#22d3ee','#f59e0b','#f43f5e'],data=[t.fixo,t.variavel,t.parcela,t.fin];
  charts.push(new Chart($('#c1'),{type:'doughnut',data:{labels:['Fixos','Variáveis','Parcelas','Financiamentos'],datasets:[{data,backgroundColor:pal,borderWidth:0}]},options:{cutout:'68%',maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:tx}}}}}));
  const ms=[-5,-4,-3,-2,-1,0].map(n=>addM(month,n));
  charts.push(new Chart($('#c2'),{type:'bar',data:{labels:ms.map(m=>lbl(m).slice(0,3)),datasets:[{label:'Renda',data:ms.map(m=>tot(m).in),backgroundColor:'#10b981',borderRadius:6},{label:'Gastos',data:ms.map(m=>tot(m).out),backgroundColor:'#f43f5e',borderRadius:6}]},options:{maintainAspectRatio:false,scales:{x:{ticks:{color:tx},grid:{color:bd}},y:{ticks:{color:tx},grid:{color:bd}}},plugins:{legend:{labels:{color:tx}}}}}));}
